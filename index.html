<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crypto Radar" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>幣圈雷達 V2</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#111821; --panel2:#151f2b; --text:#eef5ff; --muted:#8ea2b7;
      --line:#223042; --long:#31d18b; --short:#ff6677; --watch:#f2bf58; --blue:#5aa7ff;
      --shadow:0 10px 30px rgba(0,0,0,.28); --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .topbar{
      position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
      backdrop-filter:blur(16px);background:rgba(11,15,20,.88);border-bottom:1px solid rgba(255,255,255,.05)
    }
    .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
    .statusdot{width:8px;height:8px;border-radius:50%;background:var(--watch);box-shadow:0 0 12px currentColor}
    .status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
    .wrap{padding:14px 14px 22px;max-width:900px;margin:auto}
    .hero{
      background:linear-gradient(145deg,#121a24,#0e151e);border:1px solid var(--line);border-radius:22px;
      padding:16px;box-shadow:var(--shadow)
    }
    .herohead{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .marketMood{font-size:13px;color:var(--muted)}
    .moodValue{font-size:28px;font-weight:800;margin-top:4px}
    .scanBtn{
      border:0;background:var(--blue);color:#07101b;border-radius:14px;padding:12px 16px;font-weight:800;min-width:112px
    }
    .scanBtn:disabled{opacity:.5;cursor:not-allowed}
    .progress{height:7px;border-radius:999px;background:#0a0f15;margin-top:14px;overflow:hidden;border:1px solid #1d2937}
    .progress>div{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--long));transition:width .2s}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    .metric{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:10px}
    .metric b{display:block;font-size:18px;margin-top:3px}
    .metric span{font-size:11px;color:var(--muted)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
    .control{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
    .control label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
    .control select,.control input{
      width:100%;background:transparent;border:0;color:var(--text);outline:0
    }
    .tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
    .tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap}
    .tab.active{background:#1b2a3b;color:#fff;border-color:#31506f}
    .list{display:flex;flex-direction:column;gap:10px}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 5px 18px rgba(0,0,0,.15)
    }
    .cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .symbol{font-weight:850;font-size:18px;letter-spacing:.2px}
    .price{font-size:12px;color:var(--muted);margin-top:4px}
    .badge{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;border:1px solid}
    .badge.LONG{color:var(--long);border-color:rgba(49,209,139,.35);background:rgba(49,209,139,.08)}
    .badge.SHORT{color:var(--short);border-color:rgba(255,102,119,.35);background:rgba(255,102,119,.08)}
    .badge.WATCH{color:var(--watch);border-color:rgba(242,191,88,.35);background:rgba(242,191,88,.08)}
    .scoreRow{display:flex;align-items:center;gap:9px;margin-top:12px}
    .score{font-size:24px;font-weight:900;min-width:62px}
    .bars{flex:1}
    .bar{height:7px;border-radius:99px;background:#0a0f15;overflow:hidden;margin:4px 0}
    .bar i{display:block;height:100%;border-radius:99px}
    .bar.long i{background:var(--long)}
    .bar.short i{background:var(--short)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .mini{background:var(--panel2);border-radius:12px;padding:9px;border:1px solid rgba(255,255,255,.035)}
    .mini span{font-size:10px;color:var(--muted);display:block}
    .mini b{font-size:13px;display:block;margin-top:3px}
    .reason{font-size:12px;color:#c2d0df;margin-top:10px;line-height:1.5}.factorline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.factor{font-size:10px;padding:4px 7px;border-radius:999px;background:#172334;color:#b9cbe0;border:1px solid #26384c}.risk.low{color:var(--long)}.risk.mid{color:var(--watch)}.risk.high{color:var(--short)}
    .empty{padding:34px 18px;text-align:center;color:var(--muted)}
    .error{margin:12px 0;padding:12px 13px;border-radius:14px;background:rgba(255,102,119,.09);border:1px solid rgba(255,102,119,.3);color:#ffc1c8;font-size:12px;line-height:1.5}
    .notice{margin:12px 0;padding:12px 13px;border-radius:14px;background:rgba(90,167,255,.08);border:1px solid rgba(90,167,255,.25);color:#cde3ff;font-size:12px;line-height:1.5}
    .footer{color:var(--muted);font-size:11px;line-height:1.5;padding:18px 4px}
    .bottom{
      position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(11,15,20,.93);backdrop-filter:blur(18px);
      border-top:1px solid rgba(255,255,255,.06);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
      display:flex;justify-content:space-around
    }
    .nav{background:none;border:0;color:var(--muted);font-size:11px;display:grid;gap:4px;place-items:center}
    .nav strong{font-size:18px}
    .nav.active{color:var(--blue)}
    .fav{background:none;border:0;color:#718398;font-size:21px;padding:0 2px}
    .fav.on{color:var(--watch)}
    .pill{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;margin-left:6px;background:#1b2a3b;color:#bcd4ef}
    @media(min-width:700px){
      .list{display:grid;grid-template-columns:1fr 1fr}
      .controls{grid-template-columns:repeat(4,1fr)}
    }
  </style>
</head>
<body>

  <main class="wrap">

          <option value="5000000">5M USDT</option>

    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="ALL">全部</button>

    <section class="list" id="resultList"></section>
    <div class="footer">
      本工具僅供市場掃描與研究。綜合訊號分是多因子強弱評分，不是上漲／下跌機率。正式交易前應先做歷史回測、模擬交易與風險控管。
    </div>
  </main>

  <nav class="bottom">
    <button class="nav active"><strong>⌁</strong><span>雷達</span></button>
    <button class="nav" id="quickLong"><strong>↗</strong><span>偏多</span></button>
    <button class="nav" id="quickShort"><strong>↘</strong><span>偏空</span></button>
    <button class="nav" id="quickFav"><strong>★</strong><span>自選</span></button>
  </nav>

<script>
(() => {
  "use strict";

  const API_BASES = [
    "https://fapi.binance.com",
    "https://fapi1.binance.com",
    "https://fapi2.binance.com",
    "https://fapi3.binance.com",
    "https://fapi4.binance.com"
  ];

  const $ = (id) => document.getElementById(id);
  const state = {
    scanning: false,
    results: [],
    filter: "ALL",
    favorites: new Set(JSON.parse(localStorage.getItem("cr_v2_favs") || "[]")),
    apiBase: localStorage.getItem("cr_api_base") || API_BASES[0],
    abortController: null
  };

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const n = (v, d=0) => {
    const x = Number(v);
    return Number.isFinite(x) ? x : d;
  };
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const pct = (a,b) => b ? (a / b - 1) * 100 : 0;
  const fmtPct = (v) => `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
  const fmtNum = (v) => {
    const x = n(v);
    if (Math.abs(x) >= 1e9) return (x/1e9).toFixed(2)+"B";
    if (Math.abs(x) >= 1e6) return (x/1e6).toFixed(2)+"M";
    if (Math.abs(x) >= 1e3) return (x/1e3).toFixed(2)+"K";
    if (Math.abs(x) >= 1) return x.toLocaleString(undefined,{maximumFractionDigits:4});
    return x.toPrecision(4);
  };

  function ema(arr, span){
    if(!arr.length) return 0;
    const alpha = 2/(span+1);
    let e = arr[0];
    for(let i=1;i<arr.length;i++) e = alpha*arr[i] + (1-alpha)*e;
    return e;
  }
  function emaSeries(arr, span){
    if(!arr.length) return [];
    const alpha=2/(span+1);
    const out=new Array(arr.length);
    out[0]=arr[0];
    for(let i=1;i<arr.length;i++) out[i]=alpha*arr[i]+(1-alpha)*out[i-1];
    return out;
  }


  function rsi(arr, period=14){
    if(arr.length < period+1) return 50;
    let gains=[], losses=[];
    for(let i=1;i<arr.length;i++){
      const d = arr[i]-arr[i-1];
      gains.push(Math.max(d,0));
      losses.push(Math.max(-d,0));
    }
    const alpha = 1/period;
    let ag=gains[0], al=losses[0];
    for(let i=1;i<gains.length;i++){
      ag = alpha*gains[i] + (1-alpha)*ag;
      al = alpha*losses[i] + (1-alpha)*al;
    }
    if(al===0) return 100;
    return 100 - 100/(1+ag/al);
  }

  async function fetchJson(path, params={}, timeout=9000){
    const qs = new URLSearchParams(params).toString();
    const suffix = qs ? `?${qs}` : "";
    const ordered = [state.apiBase, ...API_BASES.filter(x => x !== state.apiBase)];
    let lastErr;
    for(const base of ordered){
      try{
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeout);
        const res = await fetch(base + path + suffix, {
          method:"GET",
          cache:"no-store",
          signal: ctrl.signal,
          headers: {"Accept":"application/json"}
        });
        clearTimeout(timer);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        state.apiBase = base;
        localStorage.setItem("cr_api_base", base);
        return data;
      }catch(err){
        lastErr = err;
      }
    }
    throw new Error(`Binance API 無法連線：${lastErr?.message || "未知錯誤"}`);
  }

  async function pool(items, worker, concurrency=5, onProgress=()=>{}){
    let idx=0, done=0, out=new Array(items.length);
    async function runner(){
      while(true){
        const i = idx++;
        if(i >= items.length) return;
        try { out[i] = await worker(items[i], i); }
        catch(e){ out[i] = null; }
        done++;
        onProgress(done, items.length);
        await sleep(40);
      }
    }
    await Promise.all(Array.from({length:Math.min(concurrency,items.length)}, runner));
    return out;
  }

  function score(m){
    // V2 九因子模型：分數代表訊號強度，不是勝率。
    const W={trend:16,momentum:14,macd:10,volume:12,oi:16,taker:10,funding:6,volatility:7,breakout:9};
    let L=0,S=0,lr=[],sr=[],factors=[];

    // 1. EMA 9/21/55 趨勢結構
    if(m.ema9>m.ema21 && m.ema21>m.ema55){
      L+=W.trend; lr.push("均線呈多頭排列"); factors.push("趨勢↑");
    }else if(m.ema9<m.ema21 && m.ema21<m.ema55){
      S+=W.trend; sr.push("均線呈空頭排列"); factors.push("趨勢↓");
    }else{
      const spread=m.ema21 ? (m.ema9/m.ema21-1)*100 : 0;
      if(spread>0){L+=W.trend*.35;lr.push("短均線偏多")}
      else if(spread<0){S+=W.trend*.35;sr.push("短均線偏空")}
    }

    // 2. 15m + 1h 價格動能
    const mix=.65*m.p15+.35*m.p1h;
    const mom=clamp(mix/1.5,-1,1);
    if(mom>0){L+=W.momentum*mom;lr.push(`價格動能 ${fmtPct(mix)}`);factors.push("動能↑")}
    else if(mom<0){S+=W.momentum*Math.abs(mom);sr.push(`價格動能 ${fmtPct(mix)}`);factors.push("動能↓")}

    // 3. MACD 12/26/9 柱體
    const macdNorm=m.price ? (m.macdHist/m.price)*100 : 0;
    const macdAccel=m.price ? ((m.macdHist-m.macdHistPrev)/m.price)*100 : 0;
    if(macdNorm>0){
      L+=W.macd*clamp(Math.abs(macdNorm)*180,.2,1);
      lr.push(macdAccel>0?"MACD 多方動能擴張":"MACD 維持多方");
    }else if(macdNorm<0){
      S+=W.macd*clamp(Math.abs(macdNorm)*180,.2,1);
      sr.push(macdAccel<0?"MACD 空方動能擴張":"MACD 維持空方");
    }

    // 4. 成交量 + 量能加速度
    if(m.volSpike>=1){
      const vs=clamp((m.volSpike-1)/1.2,0,1);
      const va=clamp((m.volAccel-1)/1.0,0,1);
      const vscore=clamp(.65*vs+.35*va,0,1);
      if(m.p15>=0){L+=W.volume*vscore;lr.push(`成交量 ${m.volSpike.toFixed(1)} 倍`)}
      else{S+=W.volume*vscore;sr.push(`成交量 ${m.volSpike.toFixed(1)} 倍`)}
      if(m.volAccel>1.4) factors.push("量能加速");
    }

    // 5. OI 變化 + OI 加速度
    const oiMix=.7*m.oi15+.3*m.oi1h;
    if(oiMix>0){
      const base=clamp(oiMix/3,0,1);
      const acc=clamp(Math.max(m.oiAccel,0)/1.5,0,1);
      const os=clamp(.75*base+.25*acc,0,1);
      if(m.p15>=0){L+=W.oi*os;lr.push(`未平倉量 +${oiMix.toFixed(2)}%`)}
      else{S+=W.oi*os;sr.push(`未平倉量 +${oiMix.toFixed(2)}%`)}
      if(m.oiAccel>.5) factors.push("OI加速");
    }else if(oiMix<-1){
      factors.push("OI下降");
    }

    // 6. Taker 主動買賣比
    if(m.taker>=1.12){
      L+=W.taker*clamp((m.taker-1)/.45,0,1);
      lr.push(`主動買盤較強 ${m.taker.toFixed(2)}`);
    }else if(m.taker>0 && m.taker<=.89){
      S+=W.taker*clamp((1-m.taker)/.45,0,1);
      sr.push(`主動賣盤較強 ${m.taker.toFixed(2)}`);
    }

    // 7. Funding：極端值視為市場擁擠
    const fAbs=Math.abs(m.funding);
    let crowdRisk=fAbs>=.0008?3:fAbs>=.0004?2:fAbs>=.0002?1:0;
    if(m.funding>=.0005){
      S+=W.funding*clamp(fAbs/.0015,0,1);
      sr.push(`多方資金費率偏擁擠 ${(m.funding*100).toFixed(4)}%`);
    }else if(m.funding<=-.0005){
      L+=W.funding*clamp(fAbs/.0015,0,1);
      lr.push(`空方資金費率偏擁擠 ${(m.funding*100).toFixed(4)}%`);
    }

    // 8. ATR 波動率：適中波動加分，極端波動提高風險
    if(m.atrPct>=.45 && m.atrPct<=2.8){
      const vs=clamp(m.atrPct/2,0,1);
      if(m.p15>=0)L+=W.volatility*vs;
      else S+=W.volatility*vs;
    }
    if(m.atrPct>4.5){crowdRisk=Math.max(crowdRisk,2);factors.push("高波動")}

    // 9. 近20根突破 / 跌破
    if(m.breakoutUp){
      L+=W.breakout;lr.push("突破近期高點");factors.push("突破");
    }else if(m.breakoutDown){
      S+=W.breakout;sr.push("跌破近期低點");factors.push("跌破");
    }else{
      if(m.bbPos>.8 && m.p15>0)L+=W.breakout*.35;
      if(m.bbPos<.2 && m.p15<0)S+=W.breakout*.35;
    }

    // RSI 只作風險修正，避免把超買直接等同做空
    if(m.rsi>80){L*=.90;crowdRisk=Math.max(crowdRisk,2);factors.push("RSI過熱")}
    if(m.rsi<20){S*=.90;crowdRisk=Math.max(crowdRisk,2);factors.push("RSI超賣")}

    const max=Object.values(W).reduce((a,b)=>a+b,0);
    L=Math.round(1000*L/max)/10;
    S=Math.round(1000*S/max)/10;
    const d=L-S;

    let signal,confidence,reason;
    if(Math.max(L,S)<30 || Math.abs(d)<9){
      signal="WATCH";confidence=Math.max(L,S);reason=(L>=S?lr:sr).slice(0,5).join("；");
    }else if(d>0){
      signal="LONG";confidence=L;reason=lr.slice(0,5).join("；");
    }else{
      signal="SHORT";confidence=S;reason=sr.slice(0,5).join("；");
    }

    let setup="一般";
    if(confidence>=70 && Math.abs(d)>=22 && crowdRisk<=1) setup="強勢";
    else if(confidence>=55 && Math.abs(d)>=15) setup="較強";
    else if(confidence<40) setup="偏弱";

    return{
      longScore:L,shortScore:S,signal,confidence,
      reason:reason||"暫無明顯方向優勢",
      crowdRisk,setup,factors:[...new Set(factors)].slice(0,5)
    };
  }
  async function analyzeSymbol(ticker,fundingMap){
    const symbol=ticker.symbol;
    const [kl,oi,taker]=await Promise.all([
      fetchJson("/fapi/v1/klines",{symbol,interval:"5m",limit:"160"}),
      fetchJson("/futures/data/openInterestHist",{symbol,period:"5m",limit:"13"}),
      fetchJson("/futures/data/takerlongshortRatio",{symbol,period:"5m",limit:"5"})
    ]);

    if(!Array.isArray(kl)||kl.length<60||!Array.isArray(oi)||oi.length<4) throw new Error("資料不足");

    const high=kl.map(x=>n(x[2])),low=kl.map(x=>n(x[3])),close=kl.map(x=>n(x[4])),qvol=kl.map(x=>n(x[7]));
    const price=close.at(-1);
    const p15=pct(price,close.at(-4));
    const p1h=pct(price,close.at(-13));

    const base20=qvol.slice(-21,-1);
    const baseVol=base20.reduce((a,b)=>a+b,0)/Math.max(1,base20.length);
    const recent3=qvol.slice(-3).reduce((a,b)=>a+b,0)/3;
    const prior6=qvol.slice(-9,-3).reduce((a,b)=>a+b,0)/6;
    const volSpike=baseVol>0?qvol.at(-1)/baseVol:0;
    const volAccel=prior6>0?recent3/prior6:1;

    const oiv=oi.map(x=>n(x.sumOpenInterestValue));
    const oi15=pct(oiv.at(-1),oiv.at(-4));
    const oi1h=pct(oiv.at(-1),oiv.length>=13?oiv.at(-13):oiv[0]);
    const oi5=pct(oiv.at(-1),oiv.at(-2));
    const oiPrev10=pct(oiv.at(-2),oiv.at(-4))/2;
    const oiAccel=oi5-oiPrev10;

    const recentTaker=Array.isArray(taker)?taker.slice(-3):[];
    const takerRatio=recentTaker.length
      ? recentTaker.reduce((a,x)=>a+n(x.buySellRatio,1),0)/recentTaker.length
      : 1;

    const funding=n(fundingMap.get(symbol)?.lastFundingRate,0);
    const rv=rsi(close,14);
    const e9=ema(close,9),e21=ema(close,21),e55=ema(close,55);

    // 線性時間 MACD，避免手機 CPU 負擔過大
    const ema12=emaSeries(close,12);
    const ema26=emaSeries(close,26);
    const macdLine=close.map((_,i)=>ema12[i]-ema26[i]);
    const macdSignal=emaSeries(macdLine,9);
    const hist=macdLine.map((x,i)=>x-macdSignal[i]);
    const macdHist=hist.at(-1),macdHistPrev=hist.at(-2);

    // ATR(14)
    const tr=[];
    for(let i=1;i<close.length;i++){
      tr.push(Math.max(high[i]-low[i],Math.abs(high[i]-close[i-1]),Math.abs(low[i]-close[i-1])));
    }
    const atrSlice=tr.slice(-14);
    const atr=atrSlice.reduce((a,b)=>a+b,0)/Math.max(1,atrSlice.length);
    const atrPct=price?atr/price*100:0;

    // Bollinger(20,2σ)
    const c20=close.slice(-20);
    const mean20=c20.reduce((a,b)=>a+b,0)/c20.length;
    const variance=c20.reduce((a,b)=>a+(b-mean20)**2,0)/c20.length;
    const sd20=Math.sqrt(variance);
    const bbUpper=mean20+2*sd20,bbLower=mean20-2*sd20;
    const bbPos=bbUpper===bbLower?.5:clamp((price-bbLower)/(bbUpper-bbLower),0,1);

    const prevHigh=Math.max(...high.slice(-21,-1));
    const prevLow=Math.min(...low.slice(-21,-1));
    const breakoutUp=price>prevHigh;
    const breakoutDown=price<prevLow;

    const s=score({
      price,p15,p1h,volSpike,volAccel,oi15,oi1h,oiAccel,taker:takerRatio,funding,
      rsi:rv,ema9:e9,ema21:e21,ema55:e55,macdHist,macdHistPrev,atrPct,bbPos,
      breakoutUp,breakoutDown
    });

    return{
      symbol,price,qv24:n(ticker.quoteVolume),ch24:n(ticker.priceChangePercent),
      p15,p1h,volSpike,volAccel,oi15,oi1h,oiAccel,taker:takerRatio,funding,rsi:rv,
      ema9:e9,ema21:e21,ema55:e55,macdHist,atrPct,bbPos,breakoutUp,breakoutDown,...s
    };
  }
  function setMessage(text,type="notice"){
    $("messageArea").innerHTML = text ? `<div class="${type}">${text}</div>` : "";
  }

  function updateSummary(){
    const r=state.results;
    $("longCount").textContent=r.filter(x=>x.signal==="LONG").length;
    $("shortCount").textContent=r.filter(x=>x.signal==="SHORT").length;
    $("watchCount").textContent=r.filter(x=>x.signal==="WATCH").length;
    $("scanCount").textContent=r.length;
    const directional=r.filter(x=>x.signal!=="WATCH");
    if(!directional.length){$("moodValue").textContent="中性"; return;}
    const longs=directional.filter(x=>x.signal==="LONG").length;
    const lp=Math.round(100*longs/directional.length);
    $("moodValue").textContent=lp>=58?`偏多 ${lp}%`:lp<=42?`偏空 ${100-lp}%`:"多空拉鋸";
  }

  function render(){
    const minC=n($("minConfidence").value);
    const query=$("searchBox").value.trim().toUpperCase();
    let rows=state.results.filter(x=>x.confidence>=minC);
    if(query) rows=rows.filter(x=>x.symbol.includes(query));
    if(state.filter==="FAV") rows=rows.filter(x=>state.favorites.has(x.symbol));
    else if(state.filter!=="ALL") rows=rows.filter(x=>x.signal===state.filter);

    const list=$("resultList");
    if(!rows.length){
      list.innerHTML='<div class="empty">目前沒有符合條件的幣種。</div>';
      return;
    }
    list.innerHTML=rows.map(x=>{
      const star=state.favorites.has(x.symbol)?"★":"☆";
      return `
      <article class="card">
        <div class="cardtop">
          <div>
            <div class="symbol">${x.symbol}
              <button class="fav ${state.favorites.has(x.symbol)?"on":""}" data-fav="${x.symbol}">${star}</button>
            </div>
            <div class="price">$${fmtNum(x.price)} · 24H ${fmtPct(x.ch24)}</div>
          </div>
          <div class="badge ${x.signal}">${x.signal==="LONG"?"偏多":x.signal==="SHORT"?"偏空":"觀察"}</div>
        </div>
        <div class="scoreRow">
          <div class="score">${x.confidence.toFixed(0)}<div style="font-size:9px;color:var(--muted);font-weight:600">綜合訊號分</div></div>
          <div class="bars">
            <div class="bar long"><i style="width:${clamp(x.longScore,0,100)}%"></i></div>
            <div class="bar short"><i style="width:${clamp(x.shortScore,0,100)}%"></i></div>
          </div>
        </div>
        <div class="grid">
          <div class="mini"><span>15分鐘漲跌</span><b>${fmtPct(x.p15)}</b></div>
          <div class="mini"><span>1小時漲跌</span><b>${fmtPct(x.p1h)}</b></div>
          <div class="mini"><span>爆量倍率</span><b>${x.volSpike.toFixed(2)} 倍</b></div>
          <div class="mini"><span>量能加速度</span><b>${x.volAccel.toFixed(2)} 倍</b></div>
          <div class="mini"><span>OI 15分鐘</span><b>${fmtPct(x.oi15)}</b></div>
          <div class="mini"><span>OI加速度</span><b>${x.oiAccel>=0?"+":""}${x.oiAccel.toFixed(2)}</b></div>
          <div class="mini"><span>主動買賣比</span><b>${x.taker.toFixed(2)}</b></div>
          <div class="mini"><span>資金費率</span><b>${(x.funding*100).toFixed(4)}%</b></div>
          <div class="mini"><span>RSI強弱</span><b>${x.rsi.toFixed(1)}</b></div>
          <div class="mini"><span>ATR波動率</span><b>${x.atrPct.toFixed(2)}%</b></div>
          <div class="mini"><span>布林位置</span><b>${Math.round(x.bbPos*100)}%</b></div>
          <div class="mini"><span>24H成交額</span><b>${fmtNum(x.qv24)}</b></div>
        </div>
        <div class="factorline">
          <span class="factor">訊號型態：${x.setup}</span>
          <span class="factor risk ${x.crowdRisk>=3?"high":x.crowdRisk>=2?"mid":"low"}">擁擠風險：${x.crowdRisk>=3?"高":x.crowdRisk>=2?"中":x.crowdRisk===1?"低":"很低"}</span>
          ${(x.factors||[]).map(f=>`<span class="factor">${f}</span>`).join("")}
        </div>
        <div class="reason"><b>判斷依據：</b>${x.reason}</div>
      </article>`;
    }).join("");
  }

  async function scan(){
    if(state.scanning) return;
    state.scanning=true;
    $("scanBtn").disabled=true;
    $("scanBtn").textContent="掃描中…";
    $("statusText").textContent="連線 Binance…";
    $("statusDot").style.background="var(--watch)";
    $("progressBar").style.width="2%";
    setMessage("");

    try{
      const minV=n($("minVolume").value);
      const maxS=n($("maxSymbols").value,30);

      const [info,tickers,funding] = await Promise.all([
        fetchJson("/fapi/v1/exchangeInfo"),
        fetchJson("/fapi/v1/ticker/24hr"),
        fetchJson("/fapi/v1/premiumIndex")
      ]);

      const valid=new Set((info.symbols||[])
        .filter(x=>x.status==="TRADING"&&x.quoteAsset==="USDT"&&x.contractType==="PERPETUAL")
        .map(x=>x.symbol));

      const candidates=(tickers||[])
        .filter(t=>valid.has(t.symbol)&&n(t.quoteVolume)>=minV)
        .sort((a,b)=>n(b.quoteVolume)-n(a.quoteVolume))
        .slice(0,maxS);

      const fundingMap=new Map((funding||[]).map(x=>[x.symbol,x]));
      $("statusText").textContent=`分析 ${candidates.length} 個幣…`;
      $("progressBar").style.width="8%";

      const raw=await pool(
        candidates,
        t=>analyzeSymbol(t,fundingMap),
        5,
        (done,total)=>{$("progressBar").style.width=`${8+92*done/total}%`; $("statusText").textContent=`掃描 ${done}/${total}`;}
      );

      state.results=raw.filter(Boolean).sort((a,b)=>b.confidence-a.confidence || b.volSpike-a.volSpike);
      localStorage.setItem("cr_v2_last_results",JSON.stringify({ts:Date.now(),results:state.results.slice(0,80)}));
      updateSummary();
      render();

      $("statusText").textContent=`完成 · ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
      $("statusDot").style.background="var(--long)";
      setMessage(`掃描完成。V2 已綜合趨勢、動能、MACD、RSI、ATR、布林、量能、未平倉量、主動買賣比與資金費率。綜合訊號分只代表訊號強度，不代表勝率。`);
    }catch(err){
      console.error(err);
      $("statusText").textContent="連線失敗";
      $("statusDot").style.background="var(--short)";
      setMessage(
        `無法取得即時市場資料。常見原因：手機網路或所在地限制 Binance API、瀏覽器 CORS/內容政策、Binance 暫時限流。<br><br><b>錯誤：</b>${String(err.message||err)}`,
        "error"
      );
      const cached=JSON.parse(localStorage.getItem("cr_v2_last_results")||"null");
      if(cached?.results?.length){
        state.results=cached.results;
        updateSummary(); render();
        setMessage($("messageArea").innerHTML + `<div class="notice">已載入上次成功掃描的快取資料（${new Date(cached.ts).toLocaleString()}），避免顯示空白；請注意不是即時行情。</div>`);
      }
    }finally{
      state.scanning=false;
      $("scanBtn").disabled=false;
      $("scanBtn").textContent="重新掃描";
      $("progressBar").style.width="100%";
    }
  }

  $("scanBtn").addEventListener("click",scan);
  $("searchBox").addEventListener("input",render);
  $("minConfidence").addEventListener("change",render);
  $("resultList").addEventListener("click",e=>{
    const b=e.target.closest("[data-fav]");
    if(!b)return;
    const s=b.dataset.fav;
    state.favorites.has(s)?state.favorites.delete(s):state.favorites.add(s);
    localStorage.setItem("cr_v2_favs",JSON.stringify([...state.favorites]));
    render();
  });

  $("tabs").addEventListener("click",e=>{
    const t=e.target.closest(".tab"); if(!t)return;
    state.filter=t.dataset.filter;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
    render();
  });

  function setFilter(f){
    state.filter=f;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.filter===f));
    render(); window.scrollTo({top:260,behavior:"smooth"});
  }
  $("quickLong").onclick=()=>setFilter("LONG");
  $("quickShort").onclick=()=>setFilter("SHORT");
  $("quickFav").onclick=()=>setFilter("FAV");

  $("installBtn").addEventListener("click",()=>{
    setMessage(`iPhone：用 Safari 點「分享」→「加入主畫面」，即可像 App 一樣從桌面啟動。`);
  });

  window.addEventListener("load",()=>{
    const cached=JSON.parse(localStorage.getItem("cr_v2_last_results")||"null");
    if(cached?.results?.length){
      state.results=cached.results; updateSummary(); render();
      $("statusText").textContent=`快取 · ${new Date(cached.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;
    }else{
      render();
    }
    if("serviceWorker" in navigator && location.protocol.startsWith("http")){
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  });
})();
</script>
